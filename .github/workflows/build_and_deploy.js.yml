# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    branches: [ "main" ]
env:
  DOCKER_IMAGE_NAME: openeo-job-registry-elastic-api
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: npm run test:cov
    - run: npm run build

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
      - run: npm install
      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ] || [ "$tag" = "${{ steps.before.outputs.tag }}" ]; then
            echo "No new release created"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          if [ -z "$version" ] || [ "$version" = "0.0.0-semver" ]; then
            echo "Could not determine release version" >&2
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "docker_version=${version}" >> "$GITHUB_OUTPUT"
    outputs:
      released: ${{ steps.version.outputs.released }}
      docker_version: ${{ steps.version.outputs.docker_version }}

  deploy:
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: Validate version
        run: |
          version="${{ needs.release.outputs.docker_version }}"
          if [ -z "$version" ] || [ "$version" = "0.0.0-semver" ]; then
            echo "Invalid release version: '$version'" >&2
            exit 1
          fi

      - name: Update package.json
        run: npm pkg set version="${{ needs.release.outputs.docker_version }}"

      - run: npm install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name lowercase
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openeo-job-registry-elastic-api" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE_NAME" .

      - name: Tag image
        run: |
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}"
          docker tag "$IMAGE_NAME" "$IMAGE_NAME:latest"

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:${{ needs.release.outputs.docker_version }}"
          docker push "$IMAGE_NAME:latest"
